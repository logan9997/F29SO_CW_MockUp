<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Universal Transport System</h1>
    </header>

    <section id="search">
        <section id="left">
            <h2>Search</h2>
            <form action="" method="get">
                <div>
                    <label for="start">Starting Point</label>
                    <input type="text" name="start" id="start" value="Heriot-Watt">
                </div>
                <div>
                    <label for="start">Destination</label>
                    <input type="text" name="destination" id="destination">
                </div>
                <div>
                    <label for="date">Departure Date</label>
                    <input type="date" name="date" id="date">
                </div>
                <div>
                    <label for="time">Departure Time</label>
                    <input type="time" name="time" id="time">
                </div>
                <div>
                    <ul>
                        <li>
                            <input type="checkbox" name="taxi" id="">
                            <label for="taxi">Taxi</label>
                        </li>
                        <li>
                            <input type="checkbox" name="bus" id="">
                            <label for="bus">Bus</label>
                        </li>
                        <li>
                            <input type="checkbox" name="train" id="">
                            <label for="train">train</label>
                        </li>
                    </ul>
                </div>
            </form>
        </section>
        
        <section id="right">
            <img src="media/ediMap.png" alt="">
        </section>
    </section>

</body>
</html>
