<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="styles.css">
        <script src="script.js"></script>
    </head>
    <body>
        <div class="main">
            <header>
                <h1>Universal Transport System</h1>
            </header>

            <div class="content">
                <div class="left">
                    <h2>Search</h2>
                    <form id="form" action="javascript:formSubmit()" method="get">
                        <div>
                            <label for="start">Starting Point</label>
                            <input type="text" name="start" id="start" value="Heriot-Watt" disabled>
                        </div>
                        <div>
                            <label for="start">Destination</label>
                            <select name="destination" id="destination">
                                <option value="Haymarket">Haymarket</option>
                                <option value="Edinburgh Zoo">Edinburgh Zoo</option>
                                <option value="Napier University">Napier University</option>
                                <option value="Edinburgh Castle">Edinburgh Castle</option>
                            </select>
                        </div>
                        <div>
                            <label for="date">Departure Date</label>
                            <input type="date" name="date" id="date" value="2026-11-19">
                        </div>
                        <div>
                            <label for="time">Departure Time</label>
                            <input type="time" name="time" id="time">
                        </div>
                        <div style="display: block;">
                            <label style="margin: 10px;">Transport Modes</label>
                            <ul>
                                <li>
                                    <input type="checkbox" name="taxi" id="">
                                    <label style="color:green" for="taxi">Taxi</label>
                                </li>
                                <li>
                                    <input type="checkbox" name="bus" id="">
                                    <label style="color:blue" for="bus">Bus</label>
                                </li>
                            </ul>
                        </div>
                        <div>
                            <input type="submit" value="Search">
                        </div>
                    </form>
                </div>

                <div class="right">
                    <div id="results">
                        <div id="transport-div">
                            <span id="transport-result"></span>
                        </div>
                        <div id="cost-div">
                            <span id="cost-result"></span>
                        </div>
                    </div>

                    <div>
                        <img src="Media/vehicles.png" alt="vehicles">
                    </div>
                </div>

            </div>
        </div>
    </body>
</html>
